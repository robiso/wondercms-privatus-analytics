name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Plugin tests
        run: php tests/PluginTest.php

  wondercms:
    # Runs a real WonderCMS in Docker, saves the settings form and checks the tag.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wondercms: ["3.4.3", "3.6.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Verify in WonderCMS ${{ matrix.wondercms }}
        run: ./scripts/verify-docker.sh ${{ matrix.wondercms }}
